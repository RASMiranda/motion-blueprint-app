name: Test & Deploy

# Quality gate for GitHub Pages: `test` runs on every push and PR against
# main; `deploy` only runs on a push to main, and only once `test` has
# actually passed (needs: test). Pages is configured to deploy via this
# workflow (Settings → Pages → Source: "GitHub Actions") rather than
# "Deploy from branch", which is what makes `test` a real gate instead of
# advisory — see PWA_BUILDER_CHECKLIST.md / DEVELOPMENT.md for the manual
# checklist this automates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the CACHE_VERSION check diffs against the PR base / previous push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PWA readiness checks
        env:
          PWA_CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:pwa

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
